  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  value_notifier:
    path: ../../internal/value_notifier

dev_dependencies:
  # Code generators
  build_runner: ^2.4.8
  custom_lint: ^0.7.3
  freezed: ^2.4.7
  freezed_lint: ^0.0.7
  json_serializable: ^6.7.1
  lints: ^3.0.0 
